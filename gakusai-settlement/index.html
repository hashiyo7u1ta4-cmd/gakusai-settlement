<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4236">
<meta name="description" content="学祭出店の利益分配・立替精算・参加者管理">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>学祭精算</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon">¥</span><span>学祭精算</span></div>
    <div class="nav-caption">管理メニュー</div>
    <nav id="desktop-nav" class="nav-links" aria-label="メインメニュー"></nav>
    <div class="side-note">データはこの端末のブラウザ内に保存されます。別端末とは自動同期されません。</div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="top-label" id="top-label">学祭の精算</div><div class="top-actions"><span class="storage-indicator"><span class="dot"></span> この端末に自動保存</span><button class="btn btn-light btn-small" data-action="download-backup">バックアップ</button></div></header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="モバイルメニュー"></nav>
<dialog id="edit-dialog" class="dialog"><form id="edit-form" autocomplete="off"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="close-x" data-action="close-dialog" aria-label="閉じる">×</button></div><div id="dialog-fields" class="dialog-fields"></div><div class="dialog-actions"><button type="button" class="btn btn-light" data-action="close-dialog">キャンセル</button><button type="submit" class="btn btn-primary">保存する</button></div></form></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./app.mjs" type="module"></script>
</body>
</html>
