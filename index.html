<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4236">
<meta name="description" content="学祭の貢献ポイント・立替・拠出・精算を全員で共有管理">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>学祭精算 | 共同管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./cloud.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon">¥</span><span>学祭精算</span></div>
    <div class="nav-caption">共有管理メニュー</div>
    <nav id="desktop-nav" class="nav-links" aria-label="メインメニュー"></nav>
    <div class="side-note">記録は参加者全員で共有します。<br>入力申請は管理者の承認後に計算へ反映されます。</div>
  </aside>
  <div class="main-shell">
    <header class="topbar">
      <div class="top-label" id="top-label">学祭の精算</div>
      <div class="top-actions"><span class="storage-indicator"><span class="dot"></span><span id="sync-label">クラウド接続待ち</span></span><button class="btn btn-light btn-small" data-action="reload" type="button">更新</button></div>
    </header>
    <main id="view" class="view" aria-live="polite"><div class="center-loading">準備中…</div></main>
  </div>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="モバイルメニュー"></nav>
<dialog id="edit-dialog" class="dialog">
  <form id="edit-form" autocomplete="off">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button class="close-x" type="button" data-action="close-dialog" aria-label="閉じる">×</button></div>
    <div id="dialog-fields" class="dialog-fields"></div>
    <div class="dialog-actions"><button type="button" class="btn btn-light" data-action="close-dialog">キャンセル</button><button type="submit" class="btn btn-primary" id="submit-button">保存する</button></div>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./config.js"></script>
<script src="./app.mjs" type="module"></script>
</body>
</html>
